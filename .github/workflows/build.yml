name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build native library
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Package into ZIP
        run: |
          cd module
          mkdir -p lib/arm64-v8a
          cp libs/arm64-v8a/libzygisk.so lib/arm64-v8a/libzygisk.so
          
          mkdir -p META-INF/com/google/android
          
          # Base64 encoded update-binary (100% No Formatting Errors)
          echo "IyEvc2Jpbi9zaAp1bWFzayAwMjIKT1VURkQ9JDIKWklQRklMRT0kMwpta2RpciAtcCAvZGV2L3RtcApybSAtcmYgL2Rldi90bXAvKgpjZCAvZGV2L3RtcAp1bnppcCAtbyAiJFpJUEZJTEUiID4vZGV2L251bGwgMj4mMQouIC4vdXRpbF9mdW5jdGlvbnMuc2gKaW5zdGFsbF9tb2R1bGUKZXhpdCAw" | base64 -d > META-INF/com/google/android/update-binary
          
          echo "I01BR0lTSwo=" | base64 -d > META-INF/com/google/android/updater-script
          
          # Base64 encoded util_functions.sh
          echo "" | base64 -d > util_functions.sh
          
          chmod +x META-INF/com/google/android/update-binary
          chmod +x util_functions.sh
          chmod +x customize.sh
          
          zip -r ../Talabat-Bypass-Module.zip module.prop service.sh customize.sh META-INF lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talabat-Anhaf
          path: Talabat-Anhaf.zip
