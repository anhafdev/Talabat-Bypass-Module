name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build native library
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Package into ZIP
        run: |
          cd module
          mkdir -p zygisk
          cp libs/arm64-v8a/libzygisk.so zygisk/arm64-v8a.so
          
          # ১. META-INF ফোল্ডার তৈরি এবং পারফেক্ট ইনস্টলার স্ক্রিপ্ট লেখা
          mkdir -p META-INF/com/google/android
          
          cat << 'EOF' > META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          OUTFD=$2
          ZIPFILE=$3
          mkdir -p /dev/tmp
          rm -rf /dev/tmp/*
          cd /dev/tmp
          unzip -o "$ZIPFILE" >/dev/null 2>&1

          # মডিউল আইডি খোঁজা
          MODID=$(grep "^id=" module.prop | cut -d '=' -f 2 | tr -d '\r')
          
          if [ -z "$MODID" ]; then
            echo "! Failed to extract module ID"
            exit 1
          fi

          MODPATH="/data/adb/modules/$MODID"
          
          if [ -d "$MODPATH" ]; then
            touch "$MODPATH/update"
          else
            mkdir -p "$MODPATH"
          fi

          # ফাইল কপি করা
          cp -af . "$MODPATH"
          rm -rf "$MODPATH/META-INF"
          rm -f "$MODPATH/update-binary" "$MODPATH/updater-script" "$MODPATH/util_functions.sh"

          # পারমিশন সেট করা
          chmod 755 "$MODPATH/service.sh"
          
          echo "Module Installed Successfully!"
          exit 0
          EOF
          
          echo "#MAGISK" > META-INF/com/google/android/updater-script
          
          # পারমিশন-giving
          chmod +x META-INF/com/google/android/update-binary
          chmod +x service.sh
          
          # জিপ করা
          zip -r ../Talabat-Bypass-Module.zip .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talabat-Bypass-Module
          path: Talabat-Bypass-Module.zip
