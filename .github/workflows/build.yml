name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build native library
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Package into ZIP
        run: |
          cd module
          mkdir -p zygisk
          cp libs/arm64-v8a/libzygisk.so zygisk/arm64-v8a.so
          
          # META-INF ফোল্ডার তৈরি
          mkdir -p META-INF/com/google/android
          
          # Base64 এনকোডেড update-binary (১০০% নিশ্চিত কোনো স্পেস ঢুকবে না)
          echo "IyEvc2Jpbi9zaAp1bWFzayAwMjIKT1VURkQ9JDIKWklQRklMRT0kMwpta2RpciAtcCAvZGV2L3RtcApybSAtcmYgL2Rldi90bXAvKgpjZCAvZGV2L3RtcAp1bnppcCAtbyAiJFpJUEZJTEUiID4vZGV2L251bGwgMj4mMQouIC4vdXRpbF9mdW5jdGlvbnMuc2gKaW5zdGFsbF9tb2R1bGUKZXhpdCAw" | base64 -d > META-INF/com/google/android/update-binary
          
          # updater-script তৈরি
          echo "I01BR0lTSwo=" | base64 -d > META-INF/com/google/android/updater-script
          
          # Base64 এনকোডেড util_functions.sh
          echo "" | base64 -d > util_functions.sh
          
          chmod +x META-INF/com/google/android/update-binary
          chmod +x util_functions.sh
          chmod +x service.sh
          
          # নিশ্চিত করা যে সব ফাইল ঠিক আছে
          ls -la
          
          # শুধুমাত্র প্রয়োজনীয় ফাইলগুলো জিপ করা
          zip -r ../Talabat-Bypass-Module.zip META-INF module.prop service.sh util_functions.sh zygisk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talabat-Bypass-Module
          path: Talabat-Bypass-Module.zip
