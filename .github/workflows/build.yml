name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build native library with ndk-build
        run: |
          cd module
          ndk-build

      - name: Package module into flashable ZIP
        run: |
          cd module
          mkdir -p zygisk
          cp libs/arm64-v8a/libzygisk.so zygisk/arm64-v8a.so
          zip -r ../Talabat-Bypass-Module.zip .

      - name: Upload Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Talabat-Bypass-Module
          path: Talabat-Bypass-Module.zip
