name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build native library
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Package into ZIP
        run: |
          cd module
          mkdir -p zygisk
          cp libs/arm64-v8a/libzygisk.so zygisk/arm64-v8a.so
          
          # গিটহাবে মিসিং ফাইলগুলো অটোমেটিক তৈরি করা হচ্ছে
          mkdir -p META-INF/com/google/android
          
          cat << 'EOF' > META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          OUTFD=$2
          ZIPFILE=$3
          mkdir -p /dev/tmp
          rm -rf /dev/tmp/*
          cd /dev/tmp
          unzip -o "$ZIPFILE" >/dev/null 2>&1
          . ./util_functions.sh
          install_module
          exit 0
          EOF
          
          echo "#MAGISK" > META-INF/com/google/android/updater-script
          echo "#!/system/bin/sh" > util_functions.sh
          
          chmod +x META-INF/com/google/android/update-binary
          chmod +x service.sh
          chmod +x util_functions.sh
          zip -r ../Talabat-Bypass-Module.zip .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talabat-Bypass-Module
          path: Talabat-Bypass-Module.zip
