name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build native library
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Package into ZIP
        run: |
          cd module
          mkdir -p zygisk
          cp libs/arm64-v8a/libzygisk.so zygisk/arm64-v8a.so
          
          # 1. META-INF ফোল্ডার তৈরি
          mkdir -p META-INF/com/google/android
          
          # 2. update-binary ফাইল তৈরি (echo ব্যবহার করে, যাতে কোনো এরর না হয়)
          echo '#!/sbin/sh' > META-INF/com/google/android/update-binary
          echo 'umask 022' >> META-INF/com/google/android/update-binary
          echo 'OUTFD=$2' >> META-INF/com/google/android/update-binary
          echo 'ZIPFILE=$3' >> META-INF/com/google/android/update-binary
          echo 'mkdir -p /dev/tmp' >> META-INF/com/google/android/update-binary
          echo 'rm -rf /dev/tmp/*' >> META-INF/com/google/android/update-binary
          echo 'cd /dev/tmp' >> META-INF/com/google/android/update-binary
          echo 'unzip -o "$ZIPFILE" >/dev/null 2>&1' >> META-INF/com/google/android/update-binary
          echo '. ./util_functions.sh' >> META-INF/com/google/android/update-binary
          echo 'install_module' >> META-INF/com/google/android/update-binary
          echo 'exit 0' >> META-INF/com/google/android/update-binary
          
          echo "#MAGISK" > META-INF/com/google/android/updater-script
          
          # 3. util_functions.sh তৈরি (যাতে update-binary কাজ করতে পারে)
          echo '#!/system/bin/sh' > util_functions.sh
          echo 'install_module() {' >> util_functions.sh
          echo '  MODID=$(grep_prop id "$TMPDIR/module.prop")' >> util_functions.sh
          echo '  MODPATH="$NVBASE/modules/$MODID"' >> util_functions.sh
          echo '  if [ -d "$MODPATH" ]; then touch "$MODPATH/update"; else mkdir -p "$MODPATH"; fi' >> util_functions.sh
          echo '  cp -af "$TMPDIR"/* "$MODPATH"' >> util_functions.sh
          echo '  rm -rf "$MODPATH/META-INF" "$MODPATH/util_functions.sh" "$MODPATH/update-binary" "$MODPATH/updater-script"' >> util_functions.sh
          echo '  ui_print "- Module Installed Successfully!"' >> util_functions.sh
          echo '}' >> util_functions.sh
          echo 'grep_prop() {' >> util_functions.sh
          echo '  REGEX="s/^$1=//p"' >> util_functions.sh
          echo '  shift' >> util_functions.sh
          echo '  FILES=$@' >> util_functions.sh
          echo '  [ -z "$FILES" ] && FILES="/system/build.prop"' >> util_functions.sh
          echo '  sed -n "$REGEX" $FILES 2>/dev/null | head -n 1' >> util_functions.sh
          echo '}' >> util_functions.sh
          
          # 4. পারমিশন সেট করা
          chmod +x META-INF/com/google/android/update-binary
          chmod +x util_functions.sh
          chmod +x service.sh
          
          # 5. ZIP তৈরি
          zip -r ../Talabat-Bypass-Module.zip .
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talabat-Bypass-Module
          path: Talabat-Bypass-Module.zip
