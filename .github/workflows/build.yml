name: Build Zygisk Module

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build native library
        run: |
          cd module
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk

      - name: Package into ZIP
        run: |
          cd module
          mkdir -p lib/arm64-v8a
          cp libs/arm64-v8a/libzygisk.so lib/arm64-v8a/libzygisk.so
          
          mkdir -p META-INF/com/google/android
          
          # ১. update-binary তৈরি (TMPDIR এবং NVBASE সেট করা)
          cat << 'EOF' > META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          OUTFD=$2
          ZIPFILE=$3
          export TMPDIR=/dev/tmp
          export NVBASE=/data/adb
          mkdir -p $TMPDIR
          cd $TMPDIR
          unzip -o "$ZIPFILE" >/dev/null 2>&1
          . ./util_functions.sh
          install_module
          exit 0
          EOF
          
          echo "#MAGISK" > META-INF/com/google/android/updater-script
          
          # ২. util_functions.sh তৈরি (REGEX এবং MODID ঠিক করা)
          cat << 'EOF' > util_functions.sh
          #!/system/bin/sh
          install_module() {
            MODID=$(grep_prop id "$TMPDIR/module.prop")
            MODPATH="$NVBASE/modules/$MODID"
            if [ -d "$MODPATH" ]; then touch "$MODPATH/update"; else mkdir -p "$MODPATH"; fi
            cp -af "$TMPDIR"/* "$MODPATH"
            rm -rf "$MODPATH/META-INF" "$MODPATH/util_functions.sh" "$MODPATH/update-binary" "$MODPATH/updater-script"
            echo "- Module Installed Successfully!"
          }
          grep_prop() {
            REGEX="s/^$1=//p"
            shift
            FILES=$@
            [ -z "$FILES" ] && FILES="/system/build.prop"
            sed -n "$REGEX" $FILES 2>/dev/null | head -n 1
          }
          EOF
          
          chmod +x META-INF/com/google/android/update-binary
          chmod +x util_functions.sh
          chmod +x customize.sh
          
          # ৩. জিপ করা (util_functions.sh সহ)
          zip -r ../Talabat-Bypass-Module.zip module.prop service.sh customize.sh util_functions.sh META-INF lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # ৪. আর্টিফ্যাক্টের নাম হুবহু মিলিয়ে দেওয়া হলো
          name: Talabat-Bypass-Module
          path: Talabat-Bypass-Module.zip
